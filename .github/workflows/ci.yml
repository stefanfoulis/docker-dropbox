name: ci

on:
  push:
    branches:
      - 'main'
    tags:
      - '*'
  # The Dropbox client is baked into the image at build time and Dropbox stops supporting old
  # clients, so the image is rebuilt weekly to pick up new client and base image releases.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The Docker Hub account is assumed to have the same name as the GitHub repository owner.
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ github.repository_owner }}/dropbox
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,enable=true,priority=100,prefix=,suffix=,format=short
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          pull: true
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            VCS_REF=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
